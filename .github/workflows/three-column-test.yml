name: Three column layout test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node src/render-three-column-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-column-test-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: output/three-column/
          retention-days: 3
