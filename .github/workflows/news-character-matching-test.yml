name: NEWS character matching test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node src/build-character-master-test.js
      - run: node src/news-character-matching-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-character-matching-test
          path: |
            output/character-master/
            output/news-character-matching/
          retention-days: 3
