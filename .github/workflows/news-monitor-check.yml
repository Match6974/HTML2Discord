name: NEWS monitor check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check NEWS scan and dispatch
        env:
          TEST_TOKEN: ${{ secrets.ARTICLE_STATE_TEST_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.ok(process.env.TEST_TOKEN?.length>=32);
          async function call(action){
            const r=await fetch('https://mhaur-patchnote-discord.match6974.workers.dev/internal/monitor',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(60000),
              headers:{Authorization:'Bearer '+process.env.TEST_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({action})});
            assert.equal(r.status,200,action+' HTTP '+r.status);
            const data=await r.json();
            assert.equal(data.status,'ok');
            return data;
          }
          const scan=await call('scan');
          assert.ok(scan.articleCount>0);
          console.log('NEWS scan passed:',JSON.stringify(scan));
          const dispatch=await call('dispatch-test');
          assert.equal(dispatch.dispatched,true);
          console.log('GitHub dispatch accepted:',dispatch.articleId);
          JS
