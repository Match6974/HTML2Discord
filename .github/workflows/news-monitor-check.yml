name: NEWS monitor check
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor test mode
        type: choice
        options:
          - check
          - repeat-start
          - repeat-stop
        default: check
      delivery_article_id:
        description: Optional past article ID for test Discord delivery
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check NEWS scan and dispatch
        env:
          MODE: ${{ inputs.mode }}
          DELIVERY_ARTICLE_ID: ${{ inputs.delivery_article_id }}
          TEST_TOKEN: ${{ secrets.ARTICLE_STATE_TEST_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.ok(process.env.TEST_TOKEN?.length>=32);
          async function call(action){
            const r=await fetch('https://mhaur-patchnote-discord.match6974.workers.dev/internal/monitor',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(60000),
              headers:{Authorization:'Bearer '+process.env.TEST_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({action,articleId:process.env.DELIVERY_ARTICLE_ID})});
            if(!r.ok) console.log('Monitor error:',(await r.text()).slice(0,500));
            assert.equal(r.status,200,action+' HTTP '+r.status);
            const data=await r.json();
            assert.equal(data.status,'ok');
            return data;
          }
          if(process.env.MODE==='repeat-start'||process.env.MODE==='repeat-stop'){
            console.log(JSON.stringify(await call(process.env.MODE)));
            process.exit(0);
          }
          const scan=await call('scan');
          assert.ok(scan.articleCount>0);
          console.log('NEWS scan passed:',JSON.stringify(scan));
          const dispatch=await call(process.env.DELIVERY_ARTICLE_ID?'delivery-test':'dispatch-test');
          assert.equal(dispatch.dispatched,true);
          console.log('GitHub dispatch accepted:',dispatch.articleId);
          JS
