name: NEWS Discord integration test
on:
  workflow_dispatch:
    inputs:
      news_url:
        description: Official NEWS URL
        required: true
        default: 'https://mhaur.bn-ent.net/news/?p=1573'
      force_master:
        description: Force character master refresh
        type: boolean
        default: false
concurrency:
  group: discord-test-posts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install npm packages
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Check Chromium and install missing system dependencies
        timeout-minutes: 5
        run: |
          smoke_test() {
            node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({timeout: 15000}); try { const page = await browser.newPage(); await page.setContent("<p>OK</p>"); await page.screenshot(); } finally { await browser.close(); }'
          }
          if smoke_test; then
            echo "Chromium works with existing system libraries"
          else
            echo "Installing Chromium system dependencies"
            timeout 180s npx playwright install-deps chromium
            smoke_test
          fi
      - name: Restore Japanese font cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/html2discord
          key: noto-cjk-ubuntu24.04-v1
      - name: Ensure Japanese fonts
        timeout-minutes: 5
        run: |
          font_dir="$HOME/.local/share/fonts/html2discord"
          if ! test -s "$font_dir/NotoSansCJK-Regular.ttc" || ! test -s "$font_dir/NotoSansCJK-Bold.ttc"; then
            mkdir -p "$font_dir"
            tmp="$(mktemp -d)"
            (cd "$tmp" && (apt-get download fonts-noto-cjk || (sudo apt-get update && apt-get download fonts-noto-cjk)) && dpkg-deb -x fonts-noto-cjk_*.deb extracted)
            cp "$tmp"/extracted/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold}.ttc "$font_dir/"
            rm -rf "$tmp"
          fi
          fc-cache -f "$font_dir"
          fc-match 'Noto Sans CJK JP'
      - run: node src/classify-extended-test.js
      - uses: actions/cache/restore@v4
        id: master-cache
        with:
          path: output/master-cache
          key: character-master-v1-${{ hashFiles('data/style-name-mapping.json', 'src/build-character-master-test.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            character-master-v1-${{ hashFiles('data/style-name-mapping.json', 'src/build-character-master-test.js') }}-
            character-master-v1-
      - run: node src/prepare-character-master.js
        env:
          NEWS_URL: ${{ inputs.news_url }}
          FORCE_MASTER: ${{ inputs.force_master }}
      - uses: actions/cache/save@v4
        if: hashFiles('output/master-cache/master.json') != ''
        with:
          path: output/master-cache
          key: ${{ steps.master-cache.outputs.cache-primary-key }}
      - run: node src/render-news-portrait.js
        env:
          NEWS_URL: ${{ inputs.news_url }}
      - name: Post NEWS to test Discord
        run: node src/news-discord-integration.js
        env:
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-discord-integration-test
          path: |
            output/news-portrait/
            output/character-master/
            output/discord/
          retention-days: 3
