name: NEWS regression test
on:
  workflow_dispatch:
    inputs:
      news_urls:
        description: Official NEWS URLs separated by spaces, commas or newlines
        required: true
        type: string
        default: 'https://mhaur.bn-ent.net/news/?p=1563, https://mhaur.bn-ent.net/news/?p=1573, https://mhaur.bn-ent.net/news/?p=1528, https://mhaur.bn-ent.net/news/?p=1566'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.urls.outputs.matrix }}
    steps:
      - id: urls
        env:
          NEWS_URLS: ${{ inputs.news_urls }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const urls = process.env.NEWS_URLS.trim().split(/[\s,]+/).filter(Boolean);
          const entries = new Map();
          for (const raw of urls) {
            const u = new URL(raw);
            const id = u.searchParams.get('p');
            if (u.origin !== 'https://mhaur.bn-ent.net' || u.pathname !== '/news/' || !/^\d+$/.test(id ?? '') || u.username || u.password) throw new Error('Invalid official NEWS URL: '+raw);
            entries.set(id,{id,url:'https://mhaur.bn-ent.net/news/?p='+id});
          }
          if (!entries.size || entries.size > 50) throw new Error('Specify 1 to 50 distinct articles');
          appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:[...entries.values()]})+'\n');
          JS
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: NEWS p=${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node src/render-all-pages-test.js
      - run: node src/render-news-general.js
        env:
          NEWS_URL: ${{ matrix.url }}
      - name: Determine artifact status
        if: always()
        id: status
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync,mkdirSync,writeFileSync} from 'node:fs';
          let result;
          try { result=JSON.parse(readFileSync('output/news-general/result.json','utf8')); } catch {}
          const status=process.env.JOB_STATUS==='success' && ['ok','no-target'].includes(result?.status) ? result.status : 'failed';
          mkdirSync('output/regression',{recursive:true});
          writeFileSync('output/regression/status.json',JSON.stringify({status,result:result??null},null,2));
          appendFileSync(process.env.GITHUB_OUTPUT,'status='+status+'\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'NEWS p=${{ matrix.id }}: '+status+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-regression-p${{ matrix.id }}-${{ steps.status.outputs.status }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            output/news-general/
            output/all-pages/
            output/regression/
          retention-days: 3
