name: NEWS two column test
on:
  workflow_dispatch:
    inputs:
      news_url:
        description: Official NEWS article URL
        required: true
        type: string
        default: 'https://mhaur.bn-ent.net/news/?p=1573'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node src/render-news-two-column.js
        env:
          NEWS_URL: ${{ inputs.news_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-two-column-test
          path: |
            output/news-two-column/
          retention-days: 3
