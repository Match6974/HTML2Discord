name: Cloudflare Worker deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to mhaur-patchnote-discord (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-patchnote-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test article state
        run: node --test article-state.test.js
      - name: Validate Worker
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Deploy Worker
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
