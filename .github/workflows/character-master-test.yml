name: Character master test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node src/build-character-master-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-master-test
          path: output/character-master/
          retention-days: 3
