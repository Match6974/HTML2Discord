name: NEWS inspect test
on:
  workflow_dispatch:
    inputs:
      news_url:
        description: Official NEWS article URL
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node src/inspect-news.js
        env:
          NEWS_URL: ${{ inputs.news_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-inspect-test
          path: output/news-inspect/
          retention-days: 3
