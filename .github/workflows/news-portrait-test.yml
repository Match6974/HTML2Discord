name: NEWS portrait layout test
on:
  workflow_dispatch:
    inputs:
      news_url:
        description: Official NEWS URL
        required: true
        default: 'https://mhaur.bn-ent.net/news/?p=1552'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node src/classify-extended-test.js
      - run: node src/build-character-master-test.js
        continue-on-error: true
      - run: node src/render-news-portrait.js
        env:
          NEWS_URL: ${{ inputs.news_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-portrait-test
          path: |
            output/news-portrait/
            output/character-master/
          retention-days: 3
